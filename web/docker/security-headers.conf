# Sicherheits-Header für alle Antworten. nginx vererbt add_header nicht in
# Locations mit eigenem add_header; deshalb wird diese Datei dort erneut
# eingebunden. HSTS setzt die TLS-terminierende Stelle (Entscheid D-007).
add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
