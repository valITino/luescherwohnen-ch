# Statische Auslieferung von web/dist ohne Root (nginx-unprivileged, Port 8080).
server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    server_tokens off;
    include /etc/nginx/snippets/security-headers.conf;

    gzip            on;
    gzip_vary       on;
    gzip_types      text/css text/plain application/xml image/svg+xml;
    gzip_min_length 1024;

    charset utf-8;
    error_page 404 /404.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Kontaktformular-Dienst (Compose-Dienst "kontakt"). Die Auflösung erfolgt
    # zur Laufzeit, damit nginx auch ohne den Dienst startet.
    location /kontakt {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        resolver 127.0.0.11 valid=30s ipv6=off;
        resolver_timeout 2s;
        set $kontakt_upstream "http://kontakt:3000";
        proxy_pass $kontakt_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
        client_max_body_size 16k;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
