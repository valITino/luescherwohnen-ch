# nginx für die statische Website (Image nginxinc/nginx-unprivileged, Port 8080, ohne root).
# Adressen wie bei GitHub Pages: /impressum → impressum.html, /ordner/ → ordner/index.html,
# sonst 404.html. Security-Header kommen aus security-headers.inc (generiert beim Build aus
# @luescher/config/security); jede Location bindet sie ein, weil nginx add_header nicht vererbt,
# sobald eine Location eigene add_header setzt.

# Datensparsames Zugriffslog: Zeit, Methode, Pfad, Status, Grösse. Keine IP-Adresse, kein
# User-Agent, keine Abfrageparameter (Datenminimierung, Datenschutzerklärung).
log_format privacy '$time_iso8601 "$request_method $uri" $status $body_bytes_sent $request_time';

server {
    access_log /dev/stdout privacy;

    # Nur IPv4: Nicht jede Laufzeitumgebung hat IPv6 (nginx würde sonst nicht starten).
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;
    port_in_redirect off;
    autoindex off;
    charset utf-8;
    charset_types text/plain text/css text/xml application/javascript application/json application/manifest+json image/svg+xml;

    # Nur Lesen: alles andere als GET/HEAD gibt es hier nicht. Die Antwort trägt dieselben
    # Security-Header wie alle anderen (benannte Location über error_page).
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }
    error_page 405 @method_not_allowed;
    location @method_not_allowed {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Allow "GET, HEAD" always;
        add_header Cache-Control "no-store" always;
        return 405;
    }

    # Auf Server-Ebene gelten die Header nur dort, wo keine Location eigene setzt: bei Fehlern, die
    # vor der Location-Auswahl entstehen (z. B. 400 bei Pfaden ausserhalb des Web-Verzeichnisses).
    include /etc/nginx/conf.d/security-headers.inc;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/javascript application/json application/manifest+json application/xml image/svg+xml;

    # Für den Healthcheck im Container und für Orchestrierung; kein Inhalt, kein Log.
    location = /healthz {
        access_log off;
        default_type text/plain;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # Gehashte Assets: ein Jahr, unveränderlich
    location /_astro/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Vorschaubilder für Link-Vorschauen dürfen von anderen Websites eingebunden werden.
    location /og/ {
        include /etc/nginx/conf.d/security-headers-cross-origin.inc;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        try_files $uri =404;
    }

    # Styleguide und 404 gehören nicht in Suchmaschinen.
    location ~ ^/(styleguide|404)(\.html)?$ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri.html =404;
    }

    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Kurzadresse für security.txt (RFC 9116 erlaubt beide Orte)
    location = /security.txt {
        include /etc/nginx/conf.d/security-headers.inc;
        return 301 /.well-known/security.txt;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
