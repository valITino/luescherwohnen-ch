# Wiederverwendbares Modul: Dockerfile-Lint, Image-Build ohne Push, SBOM,
# Schwachstellen-Scan und Container-Smoke-Test.
name: Container

on:
  workflow_call:

permissions:
  contents: read

jobs:
  container:
    name: hadolint, Build, SBOM, Trivy, Smoke-Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/old/ressources
          sparse-checkout-cone-mode: false
      - name: Dockerfile prüfen
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
      - name: Image bauen (kein Push)
        run: docker build --tag luescherwohnen-ch:ci .
      - name: SBOM erzeugen
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: luescherwohnen-ch:ci
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom.spdx.json
      - name: Schwachstellen-Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: luescherwohnen-ch:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Container-Smoke-Test
        run: scripts/container_smoke.sh luescherwohnen-ch:ci 8080
