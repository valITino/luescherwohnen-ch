# Wiederverwendbares Modul: Dockerfile-Lint, Image-Builds ohne Push, SBOM,
# Schwachstellen-Scan und Smoke-Test des Compose-Stacks.
name: Container

on:
  workflow_call:

permissions:
  contents: read

jobs:
  container:
    name: hadolint, Build, SBOM, Trivy, Smoke-Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/old/ressources
          sparse-checkout-cone-mode: false
      - name: Dockerfile der Website prüfen
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
      - name: Dockerfile des Kontakt-Dienstes prüfen
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: kontakt/Dockerfile
      - name: Images bauen (kein Push)
        run: |
          docker build --tag luescherwohnen-web:ci .
          docker build --tag luescherwohnen-kontakt:ci --file kontakt/Dockerfile .
      - name: SBOM Website
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: luescherwohnen-web:ci
          format: spdx-json
          output-file: sbom-web.spdx.json
          artifact-name: sbom-web.spdx.json
      - name: SBOM Kontakt-Dienst
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: luescherwohnen-kontakt:ci
          format: spdx-json
          output-file: sbom-kontakt.spdx.json
          artifact-name: sbom-kontakt.spdx.json
      - name: Schwachstellen-Scan Website
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: luescherwohnen-web:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Schwachstellen-Scan Kontakt-Dienst
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: luescherwohnen-kontakt:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Compose-Stack starten
        run: |
          printf 'WEB_IMAGE=luescherwohnen-web:ci\nKONTAKT_IMAGE=luescherwohnen-kontakt:ci\n' > deploy/.env
          docker compose --project-directory deploy -f deploy/compose.yml -f deploy/compose.ci.yml up -d
      - name: Container-Smoke-Test
        run: scripts/container_smoke.sh 8080
      - name: Stack-Logs und Aufräumen
        if: always()
        run: |
          test -f deploy/.env || printf 'WEB_IMAGE=luescherwohnen-web:ci\nKONTAKT_IMAGE=luescherwohnen-kontakt:ci\n' > deploy/.env
          docker compose --project-directory deploy -f deploy/compose.yml -f deploy/compose.ci.yml logs --no-color || true
          docker compose --project-directory deploy -f deploy/compose.yml -f deploy/compose.ci.yml down --remove-orphans || true
