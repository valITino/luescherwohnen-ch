# Publiziert freigegebene Images nach Docker Hub (CLAUDE.md, Abschnitt 5).
# Läuft nur für Release-Tags vX.Y.Z (oder manuell) und nur, wenn der
# Namensraum als Repository-Variable DOCKERHUB_NAMESPACE und die Zugangsdaten
# als Secrets DOCKERHUB_USERNAME / DOCKERHUB_TOKEN gesetzt sind. Jedes Image
# wird vor dem Push gebaut und gescannt; Tags sind unveränderlich (Version und
# Commit-SHA, kein "latest"). Das Environment "docker-hub" kann in den
# Repository-Einstellungen mit einer Freigabepflicht versehen werden.
name: Publish image

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, Scan, Push
    if: vars.DOCKERHUB_NAMESPACE != ''
    runs-on: ubuntu-24.04
    environment: docker-hub
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: luescherwohnen-web
            context: .
            dockerfile: Dockerfile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/old/ressources
          sparse-checkout-cone-mode: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ vars.DOCKERHUB_NAMESPACE }}/${{ matrix.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long,prefix=sha-
      - name: Image bauen (lokal, ohne Push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ matrix.name }}:scan
          labels: ${{ steps.meta.outputs.labels }}
      - name: Schwachstellen-Scan vor dem Push
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.name }}:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Push mit Provenance und SBOM
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
