# Wiederverwendbares Modul: Secret-Scan über Historie und Arbeitsverzeichnis.
# Läuft bei jeder Änderung (CLAUDE.md, Abschnitt 5: Basisscans laufen immer).
name: Secret-Scan

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # Vollständige Historie, damit auch frühere Commits geprüft werden.
          fetch-depth: 0
      - name: gitleaks (gepinnte Version, verifizierte Prüfsumme)
        run: scripts/secret_scan.sh
