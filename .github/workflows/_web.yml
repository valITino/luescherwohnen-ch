name: Website (wiederverwendbar)

# Format, Lint, Typen, Unit-Tests, Build beider Varianten, JS-Budget, E2E- und
# Accessibility-Tests (Playwright mit axe). Aufgerufen vom Dispatcher in ci.yml.

on:
  workflow_call:

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Lint, Typen, Unit-Tests, Build, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: pnpm über corepack aktivieren
        run: corepack enable

      - name: pnpm-Store ermitteln
        id: pnpm
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Abhängigkeiten installieren (gefrorenes Lockfile)
        run: pnpm install --frozen-lockfile

      - name: Abhängigkeiten auf bekannte Schwachstellen prüfen
        run: pnpm audit --audit-level high

      - name: Lint (ESLint, Prettier)
        run: pnpm lint

      - name: Typen
        run: pnpm typecheck

      - name: Unit-Tests
        run: pnpm test

      # Reihenfolge wichtig: build:pages überschreibt apps/web/dist.
      - name: Build (Vorschau für Pages, dann Produktion)
        run: pnpm build:pages && pnpm build

      - name: JS-Budget
        run: pnpm budgets

      - name: Chromium für Playwright installieren
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E- und Accessibility-Tests
        run: pnpm e2e

      - name: Report sichern
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
