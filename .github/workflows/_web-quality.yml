# Wiederverwendbares Modul: Build, HTML-Validierung sowie End-to-End-,
# Accessibility- und Responsive-Tests der statischen Website.
name: Website

on:
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    name: Build, HTML-Validierung, Playwright
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/old/ressources
          sparse-checkout-cone-mode: false
      - name: Abhängigkeiten aus Lockfile installieren
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: HTML validieren
        run: npm run lint:html
      - name: Chromium für Playwright installieren
        run: npx --no-install playwright install --with-deps chromium
      - name: Playwright-Tests (E2E, axe-core, Responsive, ohne JavaScript)
        run: npm run test:web
        env:
          CI: "1"
