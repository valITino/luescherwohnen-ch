# Wiederverwendbares Modul: Lint, Konfigurationsvalidierung und Unit-Tests
# für die Python-Skripte des Repositories.
name: Konfiguration und Skripte

on:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    name: ruff, Validator, Unit-Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/docs/ressources
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Werkzeuge mit Hash-Pinning installieren
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: ruff
        run: |
          ruff check scripts tests
          ruff format --check scripts tests
      - name: Claude-Konfiguration validieren
        run: python scripts/validate_claude_config.py
      - name: Unit-Tests
        run: python -m unittest discover -s tests -p 'test_*.py'
